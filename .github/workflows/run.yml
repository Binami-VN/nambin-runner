name: Runner
# Constant title: nothing about the task shows on the public run list.
run-name: Runner

# The run page shows only "succeeded" or "failed". Everything else (config, repos, agent output,
# check results) goes to a log file on the machine, then to Ops (Quản trị → Runner) and Telegram.
#
# Secrets (only workflows of this repository's default branch can read them; forks get none):
#   RUNNER_ENV     dotenv: NAMBIN_OPS_URL, NAMBIN_OPS_RUNNER_TOKEN, GIT_PUSH_TOKEN, OPS_REPOS,
#                  CURSOR_API_KEY and/or AGENT_LLM_BASE_URL + AGENT_LLM_MODEL + AGENT_LLM_API_KEY…
#   RUNNER_CONFIG  runner.config.json (sites, projects, checks)
# Nothing is read from repository variables: their values would be printed in the step header.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why
        required: false
        default: manual
  schedule:
    - cron: '17 */6 * * *'

# The job needs no GitHub API access through GITHUB_TOKEN.
permissions: {}

concurrency:
  group: runner
  cancel-in-progress: false

jobs:
  run:
    # Never in forks (they have no secrets, but no point burning their minutes either).
    if: github.repository_owner == 'Binami-VN'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Asks Ops first: an idle run (most scheduled ones) ends here, in seconds.
      - name: Check
        id: check
        env:
          RUNNER_ENV: ${{ secrets.RUNNER_ENV }}
        run: bash ci/check.sh
      - if: steps.check.outputs.work == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: steps.check.outputs.work == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Prepare
        if: steps.check.outputs.work == 'true'
        run: sudo mkdir -p /srv/ops/cache && sudo chown -R "$(id -un):" /srv/ops && chmod 711 /srv/ops
      # Caches (readable by anyone who can run a workflow here, so: public npm packages and the
      # runner's own tools only, never code of the projects or build output).
      #   tools: runner dependencies + OpenCode, installed by the runner user, never writable by the agent
      #   deps:  bun / npm download caches the sandboxed installs fill
      - name: Restore tools
        id: tools
        if: steps.check.outputs.work == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /srv/ops/runner/node_modules
            /srv/ops/tools
          key: tools-v1-${{ runner.os }}-${{ hashFiles('package.json', 'ci/run.sh') }}
      - name: Restore deps
        id: deps
        if: steps.check.outputs.work == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /srv/ops/cache
          key: deps-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: deps-v1-${{ runner.os }}-
      - name: Run
        id: run
        if: steps.check.outputs.work == 'true'
        env:
          RUNNER_ENV: ${{ secrets.RUNNER_ENV }}
          RUNNER_CONFIG: ${{ secrets.RUNNER_CONFIG }}
          REASON: ${{ inputs.reason || github.event_name }}
          TOOLS_CACHED: ${{ steps.tools.outputs.cache-hit }}
        run: bash ci/run.sh
      - name: Save tools
        if: always() && steps.run.outputs.tools_ok == 'true' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /srv/ops/runner/node_modules
            /srv/ops/tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      # Only when the download cache changed (a new key per content), not on every run.
      - name: Save deps
        if: always() && steps.run.outputs.deps_key != '' && !startsWith(steps.deps.outputs.cache-matched-key, steps.run.outputs.deps_key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /srv/ops/cache
          key: ${{ steps.run.outputs.deps_key }}
